# Dataset main configurations
dataset: Afairy
panel: Afairy
# Sample ploidy. Use 1 for haploid organisms, 2 for diploid (default),
# or higher integers for polyploids (tetraploid = 4, etc.).
# Polyploid (>2) is supported for Illumina only — Nanopore is restricted
# to ploidy 1 or 2 because clair3 has no polyploid mode.
ploidy: 2

# Nanopore only: minimum read depth for a genotype to be retained when calling variants across
# whole amplicons (clair3 gVCF). Sites with lower depth are set to missing (./.), not wild type.
min-genotype-depth: 10

cohort-columns:
  - cohort
targets: config/af-vampir.bed
metadata: config/af-vampir-samples.tsv


platform: nanopore

# Input file type options (no BCL conversion for Nanopore)
Illumina-dir: ""
from-bcl: False
fastq:
  auto: True


# Genome fasta reference files
reference-fasta: resources/reference/VectorBase-68_AfunestusAfunGA1_Genome.fasta
reference-gff3: resources/reference/VectorBase-68_AfunestusAfunGA1.gff
reference-snpeffdb: mysnpeffdb
custom-snpeffdb: True

# Specify whether to run quality-control analyses
quality-control:
  sample-min-mean-target-coverage: 5
  fastp: True
  coverage: True
  stats: True
  multiqc: True

# Specify whether to run generic analyses
analysis:  
  sample-map: False # needs lat and longs
  population-structure: True
  genetic-diversity: True
  allele-frequencies: True

# Specify whether to build jupyter results book
build-jupyter-book: True


